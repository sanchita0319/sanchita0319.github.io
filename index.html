<!DOCTYPE html>
<html>
<head>
  <title>Omnichannel Chat Test</title>
</head>
<body>
  <h2>Testing Dynamics 365 Chat Widget</h2>
	<script id="Microsoft_Omnichannel_LCWidget" src="https://oc-cdn-ocprod.azureedge.net/livechatwidget/scripts/LiveChatBootstrapper.js" data-app-id="9d1e8bd4-ee05-44e5-8aae-ce90689f34fc" data-lcw-version="prod" data-org-id="91c5dd03-eb4d-ef11-bfdf-000d3a98ad22" data-org-url="https://m-91c5dd03-eb4d-ef11-bfdf-000d3a98ad22.us.omnichannelengagementhub.com"></script>
	<script>
		const queryParams = new URLSearchParams(window.location.search);
		const fraudCaseId = queryParams.get("phone");
		const channel = queryParams.get("channel");
		const name = queryParams.get("name");
		
		function contextProvider(){
			return {
				'fraudCaseId': {'value': fraudCaseId},
				'channel': {'value': channel},
				'name': {'value': name}
			};
		}

		window.addEventListener("lcw:ready", function handleLivechatReadyEvent(){
			let registeredContextProvider = Microsoft.Omnichannel.LiveChatWidget.SDK.getContextProvider();
			Microsoft.Omnichannel.LiveChatWidget.SDK.setContextProvider(registeredContextProvider);
			Microsoft.Omnichannel.LiveChatWidget.SDK.startChat();
		});






	</script>
  </body>
</html>
